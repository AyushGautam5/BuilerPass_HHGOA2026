<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HH Goa 2026 · Builder Frame Generator</title>
<meta name="theme-color" content="#0A2620">
<meta name="description" content="Turn your photo into an HH Goa 2026 builder frame or ID card in seconds. No login, nothing uploaded — it all happens on your device.">
<style>
  :root{
    --void:#0A2620;
    --void-deep:#061712;
    --paper:#F5F1E6;
    --dim:#93A69C;
    --amber:#F5C430;
    --signal:#7CE7C6;
    --rose:#FF2E93;
    --line: rgba(245,241,230,0.16);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
    --disp: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(245,196,48,0.20) 0%, rgba(255,46,147,0.10) 32%, transparent 65%),
      linear-gradient(180deg, var(--void) 0%, var(--void-deep) 55%);
    color: var(--paper);
    font-family: var(--disp);
    padding: 28px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width: 480px; margin: 0 auto; }

  header{ text-align:center; margin-bottom: 22px; }
  .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    color: var(--signal);
    text-transform: lowercase;
    display:inline-flex; align-items:center; gap:6px;
    margin-bottom: 10px;
  }
  .eyebrow .cursor{
    width:7px; height:14px; background:var(--signal);
    animation: blink 1.1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce){ .eyebrow .cursor{ animation:none; opacity:.6; } }
  @keyframes blink{ 50%{ opacity:0; } }
  h1{
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    line-height: 1.05;
  }
  h1 .hindi{
    display:block;
    color: var(--rose);
    font-size: 26px;
    margin-top: 2px;
    text-shadow: 0 0 18px rgba(255,46,147,0.55), 0 0 4px rgba(255,46,147,0.7);
  }
  header p{
    margin:0; color: var(--dim); font-size: 14px; line-height:1.5;
  }

  .card{
    background: rgba(245,241,230,0.04);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px;
    backdrop-filter: blur(6px);
  }

  .seg{
    display:flex; background: rgba(10,38,32,0.55);
    border:1px solid var(--line); border-radius: 999px; padding:4px;
    margin-bottom: 16px;
  }
  .seg button{
    flex:1; border:none; background:transparent; color: var(--dim);
    font-family: var(--mono); font-size: 12.5px; letter-spacing:.03em;
    padding: 10px 6px; border-radius: 999px; cursor:pointer;
    transition: background .18s ease, color .18s ease;
  }
  .seg button.active{ background: var(--amber); color: var(--void-deep); font-weight:700; }

  .dropzone{
    display:block;
    border: 1.5px dashed var(--line);
    border-radius: 16px;
    padding: 28px 16px;
    text-align:center;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .dropzone.drag{ border-color: var(--signal); background: rgba(124,231,198,0.07); }
  .dropzone svg{ width:30px; height:30px; margin-bottom:10px; color: var(--signal); }
  .dropzone .dz-title{ font-weight:700; font-size:15px; margin-bottom:4px; }
  .dropzone .dz-sub{ font-size:12.5px; color: var(--dim); line-height:1.5; }
  input[type=file]{ display:none; }

  .stage{ display:none; }
  .stage.active{ display:block; }

  .canvas-wrap{
    position:relative;
    margin: 0 auto 12px;
    max-width: 340px;
    border-radius: 14px;
    overflow:hidden;
    touch-action:none;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
  canvas{ display:block; width:100%; height:auto; cursor: grab; background: var(--void); }
  canvas:active{ cursor: grabbing; }

  .hint-row{
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-family: var(--mono); font-size:11px; color: var(--dim);
    margin-bottom: 14px;
  }

  .field{ margin-bottom: 14px; }
  .field label{
    display:block; font-family: var(--mono); font-size: 11px; letter-spacing:.05em;
    color: var(--dim); text-transform:uppercase; margin-bottom:6px;
  }
  .field input[type=text]{
    width:100%; padding: 11px 12px; border-radius:10px;
    border: 1px solid var(--line); background: rgba(10,38,32,0.5);
    color: var(--paper); font-family: var(--disp); font-size:15px;
  }
  .field input[type=text]:focus{ outline:2px solid var(--signal); outline-offset:1px; }

  .title-row{ display:flex; gap:8px; align-items:stretch; }
  .title-pill{
    flex:1; padding: 11px 12px; border-radius:10px;
    border: 1px solid var(--line); background: rgba(245,196,48,0.08);
    font-family: var(--mono); font-size: 13.5px; color: var(--paper);
    display:flex; align-items:center;
  }
  .dice-btn{
    width:44px; flex-shrink:0; border-radius:10px; border:1px solid var(--line);
    background: rgba(124,231,198,0.12); color:var(--paper); font-size:18px; cursor:pointer;
  }

  .zoom-row{ display:flex; align-items:center; gap:10px; margin: 4px 0 16px; }
  .zoom-row label{ font-family: var(--mono); font-size:11px; color:var(--dim); flex-shrink:0; }
  input[type=range]{ flex:1; accent-color: var(--amber); }
  .recenter{
    font-family: var(--mono); font-size:11px; color:var(--signal); background:none;
    border: 1px solid var(--line); border-radius:8px; padding:6px 9px; cursor:pointer; flex-shrink:0;
  }

  .actions{ display:flex; flex-direction:column; gap:10px; margin-top: 4px; }
  .btn{
    border:none; border-radius: 12px; padding: 14px; font-size:15px; font-weight:800;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    font-family: var(--disp);
  }
  .btn-primary{ background: var(--amber); color: var(--void-deep); }
  .btn-secondary{ background: transparent; color: var(--paper); border: 1.5px solid var(--signal); }
  .btn:active{ transform: translateY(1px); }
  .change-photo{
    text-align:center; margin-top:12px;
  }
  .change-photo button{
    background:none; border:none; color: var(--dim); font-family: var(--mono);
    font-size: 12px; text-decoration: underline; cursor:pointer;
  }

  .status{
    text-align:center; font-family: var(--mono); font-size:12px; color: var(--signal);
    min-height: 18px; margin-top: 10px;
  }

  footer{ text-align:center; margin-top: 26px; color: var(--dim); font-family: var(--mono); font-size: 11.5px; line-height:1.8; }
  footer .tag{ color: var(--rose); font-weight:700; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">$ ./generate-builder-id<span class="cursor"></span></div>
    <h1>HACKER HOUSE <span class="hindi">गोवा</span></h1>
    <p>AI × Crypto builders only. Goa, 28–31 Oct 2026.<br>Nothing leaves your phone until you hit share.</p>
  </header>

  <div class="card">
    <div class="seg" role="tablist" aria-label="Choose format">
      <button id="segA" class="active" role="tab" aria-selected="true">PFP FRAME</button>
      <button id="segB" role="tab" aria-selected="false">BUILDER ID</button>
    </div>

    <label id="dropzone" for="fileInput" class="dropzone" tabindex="0" role="button" aria-label="Upload a photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <div class="dz-title">Drop a photo, or tap to upload</div>
      <div class="dz-sub">JPG, PNG, HEIC from your iPhone — all good.<br>Processed on your device. Nothing is uploaded or stored.</div>
      <input type="file" id="fileInput" accept="image/*,.heic,.heif">
    </label>

    <div id="stage" class="stage">
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
      </div>
      <div class="hint-row">↕ drag photo to reposition &nbsp;·&nbsp; use zoom to fill the frame</div>

      <div class="zoom-row">
        <label for="zoom">ZOOM</label>
        <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
        <button class="recenter" id="recenter" type="button">Recenter</button>
      </div>

      <div id="fieldsB">
        <div class="field">
          <label for="nameInput">Your name</label>
          <input type="text" id="nameInput" maxlength="28" placeholder="e.g. Ayush Sharma">
        </div>
        <div class="field">
          <label for="roleInput">Stack / role</label>
          <input type="text" id="roleInput" maxlength="34" placeholder="e.g. Full-Stack · React, Node">
        </div>
        <div class="field">
          <label>Builder class + AI superpower</label>
          <div class="title-row">
            <div class="title-pill" id="titlePill">—</div>
            <button class="dice-btn" id="shuffleTitle" type="button" title="Shuffle" aria-label="Shuffle builder class and AI superpower">🎲</button>
          </div>
          <div class="title-pill superpower-pill" id="superpowerPill" style="margin-top:8px;">—</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="downloadBtn" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download image
        </button>
        <button class="btn btn-secondary" id="shareBtn" type="button">
          Share to 𝕏
        </button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>

      <div class="change-photo"><button id="changePhoto" type="button">Use a different photo</button></div>
    </div>
  </div>

  <footer>
    Tag your post with <span class="tag">#FrameInGoa</span><br>
    goa, india · 28–31 oct 2026
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js" onerror="window.__heic2anyMissing=true"></script>
<script>
(function(){
  "use strict";

  // ---------- state ----------
  const state = {
    format: 'A',
    img: null,
    zoom: 1,
    panX: 0,
    panY: 0,
    dragging: false,
    lastX: 0,
    lastY: 0,
    name: '',
    role: '',
    title: '',
    superpower: '',
    flavor: '',
    idCode: ''
  };

  const COLORS = {
    void: '#0A2620',
    voidDeep: '#061712',
    paper: '#F5F1E6',
    dim: '#93A69C',
    amber: '#F5C430',
    signal: '#7CE7C6',
    rose: '#FF2E93'
  };

  // Canvas ctx.font does not understand CSS custom properties, so these
  // font stacks are spelled out literally (kept in sync with the CSS tokens above).
  const FONT_DISP = '-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif';
  const FONT_MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace';

  // ---------- dom ----------
  const $ = (id) => document.getElementById(id);
  const dropzone = $('dropzone');
  const fileInput = $('fileInput');
  const stage = $('stage');
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const zoomSlider = $('zoom');
  const recenterBtn = $('recenter');
  const fieldsB = $('fieldsB');
  const nameInput = $('nameInput');
  const roleInput = $('roleInput');
  const titlePill = $('titlePill');
  const superpowerPill = $('superpowerPill');
  const shuffleBtn = $('shuffleTitle');
  const downloadBtn = $('downloadBtn');
  const shareBtn = $('shareBtn');
  const statusEl = $('status');
  const changePhotoBtn = $('changePhoto');
  const segA = $('segA');
  const segB = $('segB');

  // ---------- helpers ----------
  function polar(cx, cy, r, angle){
    return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  }

  function roundedRectPath(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function fitFontSize(c, text, maxWidth, startSize, minSize, family, weight){
    let size = startSize;
    while (size > minSize){
      c.font = `${weight} ${size}px ${family}`;
      if (c.measureText(text).width <= maxWidth) break;
      size -= 1;
    }
    return size;
  }

  function hashStr(s){
    let h = 0;
    for (let i = 0; i < s.length; i++){
      h = (h * 31 + s.charCodeAt(i)) >>> 0;
    }
    return h;
  }

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function setStatus(msg, timeout){
    statusEl.textContent = msg || '';
    if (timeout){
      setTimeout(() => { if (statusEl.textContent === msg) statusEl.textContent = ''; }, timeout);
    }
  }

  // ---------- background + decoration ----------
  function paintBackground(w, h){
    // a sunrise breaking over dark water — the same idea as HH Goa's own
    // hero art, rebuilt as a gradient rather than a flat near-black field.
    ctx.fillStyle = COLORS.voidDeep;
    ctx.fillRect(0, 0, w, h);

    const glow = ctx.createRadialGradient(w*0.5, h*0.02, w*0.02, w*0.5, h*0.02, w*0.62);
    glow.addColorStop(0, 'rgba(245,196,48,0.55)');
    glow.addColorStop(0.35, 'rgba(255,46,147,0.22)');
    glow.addColorStop(1, 'rgba(255,46,147,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    const base = ctx.createLinearGradient(0, 0, 0, h);
    base.addColorStop(0, 'rgba(10,38,32,0)');
    base.addColorStop(0.5, COLORS.void);
    base.addColorStop(1, COLORS.voidDeep);
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, w, h);

    // faint dot grid, quiet texture
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = COLORS.paper;
    const step = w / 22;
    for (let y = step/2; y < h; y += step){
      for (let x = step/2; x < w; x += step){
        ctx.beginPath();
        ctx.arc(x, y, 1.6, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawSunburst(cx, cy, rInner, rOuter, count, colorA, colorB, alpha){
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    for (let i = 0; i < count; i++){
      const angle = (i / count) * Math.PI * 2;
      const half = (Math.PI / count) * 0.42;
      const p1 = polar(cx, cy, rInner, angle - half);
      const p2 = polar(cx, cy, rOuter, angle);
      const p3 = polar(cx, cy, rInner, angle + half);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.closePath();
      ctx.fillStyle = (i % 2 === 0) ? colorA : colorB;
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- cover-fit photo drawing with pan/zoom, clamped ----------
  function drawCoverImage(boxX, boxY, boxW, boxH){
    const img = state.img;
    const baseScale = Math.max(boxW / img.naturalWidth, boxH / img.naturalHeight);
    const scale = baseScale * state.zoom;
    const drawW = img.naturalWidth * scale;
    const drawH = img.naturalHeight * scale;

    const maxPanX = Math.max(0, (drawW - boxW) / 2);
    const maxPanY = Math.max(0, (drawH - boxH) / 2);
    state.panX = Math.min(maxPanX, Math.max(-maxPanX, state.panX));
    state.panY = Math.min(maxPanY, Math.max(-maxPanY, state.panY));

    const dx = boxX + boxW/2 - drawW/2 + state.panX;
    const dy = boxY + boxH/2 - drawH/2 + state.panY;
    ctx.drawImage(img, dx, dy, drawW, drawH);
  }

  // a palm silhouette — rendered light-on-dark so it actually reads against
  // the pine-green background (echoes the corner palm doodles on the reference cards)
  function drawPalm(x, baseY, size, color){
    ctx.save();
    ctx.translate(x, baseY);
    ctx.fillStyle = color || 'rgba(245,241,230,0.4)';
    ctx.strokeStyle = color || 'rgba(245,241,230,0.4)';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-size*0.05, 0);
    ctx.quadraticCurveTo(size*0.12, -size*0.5, size*0.02, -size*0.95);
    ctx.lineTo(-size*0.06, -size*0.92);
    ctx.quadraticCurveTo(-size*0.02, -size*0.5, -size*0.09, 0);
    ctx.closePath();
    ctx.fill();
    const top = { x: size*0.02, y: -size*0.95 };
    [-1.1, -0.55, 0, 0.55, 1.1].forEach((a) => {
      const midx = top.x + Math.sin(a) * size * 0.55;
      const midy = top.y - Math.cos(a) * size * 0.28 - size * 0.15;
      const endx = top.x + Math.sin(a) * size * 0.95;
      const endy = top.y - Math.cos(a) * size * 0.1;
      ctx.lineWidth = size * 0.09;
      ctx.beginPath();
      ctx.moveTo(top.x, top.y);
      ctx.quadraticCurveTo(midx, midy, endx, endy);
      ctx.stroke();
    });
    ctx.restore();
  }

  // curved text along a circle — 'top' reads upright along the top of the
  // ring, 'bottom' reads upright along the bottom (the classic seal/badge look)
  function drawArcText(cx, cy, r, text, side, font, color){
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const n = text.length;
    const perCharDeg = 11;
    const spanDeg = Math.min(150, Math.max(40, n * perCharDeg));
    for (let i = 0; i < n; i++){
      const t = n === 1 ? 0.5 : i / (n - 1);
      let phiDeg;
      if (side === 'top'){
        phiDeg = (270 - spanDeg/2) + t*spanDeg;
      } else {
        phiDeg = (90 + spanDeg/2) - t*spanDeg;
      }
      const phi = phiDeg * Math.PI/180;
      const x = cx + r*Math.cos(phi);
      const y = cy + r*Math.sin(phi);
      const rot = side === 'top' ? (phi + Math.PI/2) : (phi - Math.PI/2);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.fillText(text[i], 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  // a small wax-seal style badge that overlaps the photo frame — palm
  // mark in the center, curved copy wrapping top and bottom
  function drawSealBadge(cx, cy, r){
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = COLORS.voidDeep;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = COLORS.rose;
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r - 9, 0, Math.PI*2);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = COLORS.amber;
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `${Math.round(r*0.62)}px ${FONT_DISP}`;
    ctx.fillText('🌴', cx, cy + r*0.04);
    ctx.restore();
    const fSize = Math.max(12, Math.round(r*0.135));
    drawArcText(cx, cy, r - 24, 'VERIFIED BUILDER', 'top', `700 ${fSize}px ${FONT_MONO}`, COLORS.paper);
    drawArcText(cx, cy, r - 24, 'HH GOA 2026', 'bottom', `700 ${fSize}px ${FONT_MONO}`, COLORS.amber);
  }

  // gold footer bar — palm + name on the left, hashtag pill center, dates right
  function drawFooterBar(x, y, w, h){
    roundedRectPath(ctx, x, y, w, h, h/2);
    ctx.fillStyle = COLORS.amber;
    ctx.fill();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = COLORS.voidDeep;
    ctx.font = '800 20px ' + FONT_MONO;
    ctx.fillText('🌴 HACKER HOUSE GOA', x + 26, y + h/2);

    ctx.textAlign = 'right';
    ctx.fillText('28–31 OCT 2026', x + w - 26, y + h/2);

    ctx.textAlign = 'center';
    ctx.font = '700 18px ' + FONT_MONO;
    const pillText = '#FrameInGoa';
    const tw = ctx.measureText(pillText).width;
    const pillW = tw + 30, pillH = h - 14;
    const pillX = x + w/2 - pillW/2, pillY = y + 7;
    roundedRectPath(ctx, pillX, pillY, pillW, pillH, pillH/2);
    ctx.fillStyle = COLORS.rose;
    ctx.fill();
    ctx.fillStyle = COLORS.paper;
    ctx.fillText(pillText, x + w/2, y + h/2);
    ctx.textBaseline = 'alphabetic';
  }

  // real, scannable QR module grid for https://hhgoa.com (precomputed —
  // no QR-encoding library needed at runtime)
  const QR_MATRIX = ['1111111010110011101111111','1000001010110000101000001','1011101011100001001011101','1011101000010001101011101','1011101011010010101011101','1000001000110000001000001','1111111010101010101111111','0000000000101101100000000','1001111111001100110010111','0111100111011101000111110','1110101001011101110011001','1011010111110101111011111','1011101001111101101100001','1011110010000111100010010','1110001101011101111011111','1011010101010001010101101','1001101110000010111110110','0000000011011110100010110','1111111010110000101010001','1000001011101010100010011','1011101010101111111110001','1011101010000011111000011','1011101001101011010011111','1000001000000010000110111','1111111010000110100001001'];

  function drawQR(x, y, size){
    const n = QR_MATRIX.length;
    const pad = size * 0.08;
    const inner = size - pad*2;
    const cell = inner / n;
    roundedRectPath(ctx, x, y, size, size, 12);
    ctx.fillStyle = COLORS.paper;
    ctx.fill();
    ctx.fillStyle = COLORS.voidDeep;
    for (let r = 0; r < n; r++){
      for (let c = 0; c < n; c++){
        if (QR_MATRIX[r][c] === '1'){
          ctx.fillRect(x + pad + c*cell, y + pad + r*cell, cell + 0.6, cell + 0.6);
        }
      }
    }
  }

  // ---------- FORMAT A: PFP frame ----------
  function renderFormatA(){
    const S = 1200;
    canvas.width = S; canvas.height = S;
    paintBackground(S, S);

    ctx.textAlign = 'center';
    ctx.fillStyle = COLORS.amber;
    ctx.font = '800 40px ' + FONT_MONO;
    ctx.fillText('HACKER HOUSE', S/2, 76);

    ctx.save();
    ctx.fillStyle = COLORS.rose;
    ctx.shadowColor = 'rgba(255,46,147,0.65)';
    ctx.shadowBlur = 22;
    ctx.font = '800 52px ' + FONT_DISP;
    ctx.fillText('गोवा', S/2, 148);
    ctx.restore();

    const cx = S/2, cy = 610, R = 345;

    drawSunburst(cx, cy, R + 4, R + 60, 30, COLORS.amber, COLORS.rose, 1);

    // paper rim
    ctx.beginPath();
    ctx.arc(cx, cy, R + 10, 0, Math.PI*2);
    ctx.fillStyle = COLORS.paper;
    ctx.fill();

    if (state.img){
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI*2);
      ctx.closePath();
      ctx.clip();
      drawCoverImage(cx - R, cy - R, R*2, R*2);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(245,241,230,0.08)';
      ctx.fill();
    }

    // wax-seal badge, pinned at the lower-right edge of the frame
    drawSealBadge(cx + R*0.7, cy + R*0.68, 100);

    // gold footer bar
    drawFooterBar(60, 1032, S - 120, 80);
  }

  // ---------- FORMAT B: builder ID card ----------
  function renderFormatB(){
    const W = 1080, H = 1350;
    canvas.width = W; canvas.height = H;
    paintBackground(W, H);

    drawPalm(30, 210, 62, 'rgba(245,241,230,0.18)');
    drawPalm(W - 34, 1250, 70, 'rgba(245,241,230,0.16)');

    // header
    ctx.textAlign = 'left';
    ctx.fillStyle = COLORS.amber;
    ctx.font = '900 46px ' + FONT_MONO;
    ctx.fillText('HACKER', 60, 66);
    ctx.fillText('HOUSE', 60, 118);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = COLORS.rose;
    ctx.shadowColor = 'rgba(255,46,147,0.6)';
    ctx.shadowBlur = 20;
    ctx.font = '800 62px ' + FONT_DISP;
    ctx.fillText('गोवा', W/2 + 60, 100);
    ctx.restore();

    ctx.textAlign = 'right';
    ctx.fillStyle = COLORS.signal;
    ctx.font = '700 20px ' + FONT_MONO;
    ctx.fillText('2026 · BUILDER ID', W - 60, 48);

    // ticket perforation with side notches
    const perfY = 200;
    ctx.strokeStyle = 'rgba(245,241,230,0.35)';
    ctx.setLineDash([6, 8]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(40, perfY);
    ctx.lineTo(W - 40, perfY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(0, perfY, 22, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W, perfY, 22, 0, Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // photo block
    const photoX = 64, photoY = 246, photoS = 380, radius = 30;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
    roundedRectPath(ctx, photoX - 8, photoY - 8, photoS + 16, photoS + 16, radius + 6);
    ctx.fillStyle = COLORS.amber;
    ctx.fill();
    ctx.restore();

    if (state.img){
      ctx.save();
      roundedRectPath(ctx, photoX, photoY, photoS, photoS, radius);
      ctx.clip();
      drawCoverImage(photoX, photoY, photoS, photoS);
      ctx.restore();
    } else {
      roundedRectPath(ctx, photoX, photoY, photoS, photoS, radius);
      ctx.fillStyle = 'rgba(10,38,32,0.5)';
      ctx.fill();
    }

    // field rows, right of photo
    const textX = photoX + photoS + 36;
    const textMaxW = W - textX - 56;

    ctx.textAlign = 'left';
    ctx.fillStyle = COLORS.signal;
    ctx.font = '700 18px ' + FONT_MONO;
    ctx.fillText('BUILDER NAME', textX, 276);
    const displayName = (state.name || 'YOUR NAME HERE').toUpperCase();
    const nameSize = fitFontSize(ctx, displayName, textMaxW, 46, 24, FONT_DISP, 900);
    ctx.fillStyle = COLORS.paper;
    ctx.font = `900 ${nameSize}px ${FONT_DISP}`;
    ctx.fillText(displayName, textX, 276 + nameSize + 6, textMaxW);
    ctx.strokeStyle = COLORS.amber;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(textX, 276 + nameSize + 24);
    ctx.lineTo(textX + Math.min(textMaxW, ctx.measureText(displayName).width), 276 + nameSize + 24);
    ctx.stroke();

    ctx.fillStyle = COLORS.signal;
    ctx.font = '700 18px ' + FONT_MONO;
    ctx.fillText('✦ BUILDER CLASS', textX, 400);
    const classText = state.title || 'Ctrl+Shift+Builder';
    const classSize = fitFontSize(ctx, classText, textMaxW, 30, 16, FONT_DISP, 800);
    ctx.fillStyle = COLORS.rose;
    ctx.font = `800 ${classSize}px ${FONT_DISP}`;
    ctx.fillText(classText, textX, 400 + classSize + 6, textMaxW);

    ctx.fillStyle = COLORS.signal;
    ctx.font = '700 18px ' + FONT_MONO;
    ctx.fillText('</> STACK / ROLE', textX, 494);
    const roleText = state.role || 'stack / role goes here';
    const roleSize = fitFontSize(ctx, roleText, textMaxW, 26, 15, FONT_MONO, 600);
    ctx.fillStyle = COLORS.paper;
    ctx.font = `600 ${roleSize}px ${FONT_MONO}`;
    ctx.fillText(roleText, textX, 494 + roleSize + 6, textMaxW);

    ctx.fillStyle = COLORS.signal;
    ctx.font = '700 18px ' + FONT_MONO;
    ctx.fillText('⚡ AI SUPERPOWER', textX, 580);
    const superText = state.superpower || 'Reads error messages without crying';
    const superSize = fitFontSize(ctx, superText, textMaxW, 21, 13, FONT_DISP, 700);
    ctx.fillStyle = COLORS.paper;
    ctx.font = `700 ${superSize}px ${FONT_DISP}`;
    ctx.fillText(superText, textX, 580 + superSize + 4, textMaxW);

    // divider
    ctx.strokeStyle = 'rgba(245,241,230,0.2)';
    ctx.setLineDash([5, 7]);
    ctx.beginPath();
    ctx.moveTo(64, 668);
    ctx.lineTo(W - 64, 668);
    ctx.stroke();
    ctx.setLineDash([]);

    // achievement flavor line
    ctx.textAlign = 'center';
    ctx.fillStyle = COLORS.amber;
    ctx.font = '700 18px ' + FONT_MONO;
    ctx.fillText('🏆 ACHIEVEMENT UNLOCKED', W/2, 720);
    ctx.fillStyle = COLORS.paper;
    ctx.font = '700 27px ' + FONT_DISP;
    ctx.fillText(state.flavor || 'Goa is the compiler.', W/2, 763);

    // QR + builder ID block
    const qrX = 64, qrY = 832, qrSize = 210;
    drawQR(qrX, qrY, qrSize);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(245,241,230,0.55)';
    ctx.font = '600 15px ' + FONT_MONO;
    ctx.fillText('SCAN FOR EVENT INFO ↗', qrX, qrY + qrSize + 30);

    const idColX = qrX + qrSize + 44;
    const idColW = W - idColX - 56;
    ctx.fillStyle = COLORS.signal;
    ctx.font = '700 18px ' + FONT_MONO;
    ctx.fillText('BUILDER ID', idColX, qrY + 40);
    ctx.fillStyle = COLORS.amber;
    const idSize = fitFontSize(ctx, state.idCode || '#HH-GOA-0000', idColW, 46, 22, FONT_MONO, 800);
    ctx.font = `800 ${idSize}px ${FONT_MONO}`;
    ctx.fillText(state.idCode || '#HH-GOA-0000', idColX, qrY + 40 + idSize + 10, idColW);
    ctx.fillStyle = 'rgba(245,241,230,0.6)';
    const dateSize = fitFontSize(ctx, 'GOA, INDIA · 28–31 OCT 2026', idColW, 20, 12, FONT_MONO, 600);
    ctx.font = `600 ${dateSize}px ${FONT_MONO}`;
    ctx.fillText('GOA, INDIA · 28–31 OCT 2026', idColX, qrY + 40 + idSize + 48, idColW);

    // gold footer bar
    drawFooterBar(60, 1112, W - 120, 90);
  }

  function render(){
    if (state.format === 'A') renderFormatA(); else renderFormatB();
  }

  // ---------- builder title generator ----------
  const ADJ = ['Midnight','Sunburnt','Recursive','Caffeinated','Offline-First','Barefoot','Async','Serverless','Salt-Crusted','Sleep-Deprived','Tide-Powered','Hotfix','Merge-Conflicted','Beachside','Cracked','On-Chain','Mainnet-Ready','Gas-Optimized','Multichain','Testnet-Scarred'];
  const NOUN = ['Debugger','Wave Rider','Prompt Whisperer','Stack Hacker','Merge-Conflict Slayer','Night-Shipper','API Alchemist','Vibe Coder','Ctrl+Shift+Builder','Bug Whisperer','Deploy Daredevil','Idea Machine','Demo-Day Survivor','Commit Machine','Mainnet Shipper','Gas Fee Whisperer','Consensus Wrangler','Airdrop Farmer'];
  const ROLE_FLAVOR = {
    design: ['Pixel Whisperer','Contrast Ranger','Figma Sorcerer'],
    data: ['Query Slinger','Pipeline Captain','Data Whisperer'],
    ml: ['Gradient Rider','Model Whisperer','Loss-Function Wrangler'],
    ai: ['Gradient Rider','Model Whisperer','Prompt Whisperer'],
    backend: ['Server Whisperer','Uptime Guardian','API Alchemist'],
    front: ['CSS Tamer','State Wrangler','Pixel Pusher'],
    product: ['Roadmap Surfer','Scope Whisperer'],
    founder: ['Chaos Pilot','Zero-to-One Machine'],
    crypto: ['Smart Contract Slinger','Mainnet Shipper','Gas Fee Whisperer'],
    web3: ['Smart Contract Slinger','Mainnet Shipper','Consensus Wrangler'],
    solidity: ['Smart Contract Slinger','Gas Fee Whisperer'],
    chain: ['Consensus Wrangler','Mainnet Shipper']
  };

  const SUPERPOWER = [
    'Reads error messages without crying',
    'Can center a div on the first try',
    'Turns coffee into commits',
    'Debugs by staring intensely',
    'Speaks fluent Stack Overflow',
    'Never trusts a green checkmark',
    'Ships on Friday and sleeps fine',
    'Prompt-engineers their way out of anything',
    'Whispers flaky tests back to green',
    'Smells a race condition from ten lines away',
    'Explains blockchain to their parents, badly',
    'Refactors first, asks questions later',
    'Immune to merge-conflict rage',
    'Reads the docs (sometimes)',
    'Can demo on a dead WiFi connection'
  ];
  const FLAVOR = [
    'Goa is the compiler.',
    'Debugged life. Building dreams.',
    'Shipped it before the sunset.',
    'Four days, one build, no regrets.',
    'Compiled on the beach, deployed to the world.',
    'Turned an idea into an artifact.',
    'Merged the vibe into main.'
  ];

  function generateTitle(){
    const roleLower = (state.role || '').toLowerCase();
    let nounPool = NOUN.slice();
    Object.keys(ROLE_FLAVOR).forEach((k) => {
      if (roleLower.includes(k)) nounPool = nounPool.concat(ROLE_FLAVOR[k]);
    });
    const a = ADJ[Math.floor(Math.random() * ADJ.length)];
    const n = nounPool[Math.floor(Math.random() * nounPool.length)];
    return `${a} ${n}`;
  }

  function refreshTitle(){
    state.title = generateTitle();
    state.superpower = SUPERPOWER[Math.floor(Math.random() * SUPERPOWER.length)];
    state.flavor = FLAVOR[Math.floor(Math.random() * FLAVOR.length)];
    titlePill.textContent = state.title;
    superpowerPill.textContent = '⚡ ' + state.superpower;
    render();
  }

  function refreshIdCode(){
    const seedStr = (state.name || 'guest') + Date.now();
    const h = hashStr(seedStr);
    state.idCode = '#HH-GOA-' + String(1000 + (h % 9000));
  }

  // ---------- HEIC-safe image loading ----------
  function loadImageFromBlob(blob){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode-failed')); };
      img.src = url;
    });
  }

  async function loadImageFile(file){
    try{
      return await loadImageFromBlob(file);
    } catch (e){
      if (window.heic2any){
        try{
          const converted = await window.heic2any({ blob: file, toType: 'image/jpeg', quality: 0.9 });
          const blob = Array.isArray(converted) ? converted[0] : converted;
          return await loadImageFromBlob(blob);
        } catch (e2){
          throw new Error('unreadable');
        }
      }
      throw new Error('unreadable');
    }
  }

  // ---------- file handling ----------
  async function onFile(file){
    if (!file) return;
    setStatus('Reading photo…');
    try{
      const img = await loadImageFile(file);
      state.img = img;
      state.zoom = 1; state.panX = 0; state.panY = 0;
      zoomSlider.value = '1';
      dropzone.style.display = 'none';
      stage.classList.add('active');
      if (!state.title) refreshTitle();
      if (!state.idCode) refreshIdCode();
      render();
      setStatus('', 0);
      setStatus('Looking good ✓', 1600);
    } catch (err){
      setStatus('');
      alert("Couldn't read that photo. If it's an iPhone HEIC file, try switching Camera Format to \"Most Compatible\" in Settings, or upload a screenshot of it instead.");
    }
  }

  fileInput.addEventListener('change', (e) => onFile(e.target.files[0]));
  // dropzone is a native <label for="fileInput">, so clicking/tapping it opens
  // the file picker via browser-native behavior — no JS click-forwarding needed.
  // Keep a keydown fallback since labels don't natively respond to Enter/Space.
  dropzone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
  ['dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', (e) => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) onFile(f); });

  changePhotoBtn.addEventListener('click', () => {
    stage.classList.remove('active');
    dropzone.style.display = '';
    fileInput.value = '';
  });

  // ---------- format toggle ----------
  function setFormat(f){
    state.format = f;
    segA.classList.toggle('active', f === 'A');
    segB.classList.toggle('active', f === 'B');
    segA.setAttribute('aria-selected', f === 'A');
    segB.setAttribute('aria-selected', f === 'B');
    fieldsB.style.display = f === 'B' ? '' : 'none';
    state.panX = 0; state.panY = 0;
    render();
  }
  segA.addEventListener('click', () => setFormat('A'));
  segB.addEventListener('click', () => setFormat('B'));
  fieldsB.style.display = 'none';

  // ---------- fields ----------
  nameInput.addEventListener('input', () => { state.name = nameInput.value; refreshIdCode(); render(); });
  roleInput.addEventListener('input', () => { state.role = roleInput.value; render(); });
  shuffleBtn.addEventListener('click', refreshTitle);

  // ---------- zoom / pan ----------
  zoomSlider.addEventListener('input', () => { state.zoom = parseFloat(zoomSlider.value); render(); });
  recenterBtn.addEventListener('click', () => { state.zoom = 1; state.panX = 0; state.panY = 0; zoomSlider.value = '1'; render(); });

  function pointerRatio(){ return canvas.width / canvas.clientWidth; }

  canvas.addEventListener('pointerdown', (e) => {
    if (!state.img) return;
    state.dragging = true;
    state.lastX = e.clientX; state.lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!state.dragging) return;
    const ratio = pointerRatio();
    state.panX += (e.clientX - state.lastX) * ratio;
    state.panY += (e.clientY - state.lastY) * ratio;
    state.lastX = e.clientX; state.lastY = e.clientY;
    render();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(evt => {
    canvas.addEventListener(evt, () => { state.dragging = false; });
  });

  // ---------- download / share ----------
  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function buildCaption(){
    if (state.format === 'A'){
      return 'Locked in for HH Goa 2026 🌅💻 #FrameInGoa';
    }
    const who = state.name ? state.name : 'a builder';
    const title = state.title || 'Builder';
    return `${who}, ${title} — headed to HH Goa 2026. #FrameInGoa`;
  }

  function getCanvasBlob(){
    return new Promise((resolve) => canvas.toBlob(resolve, 'image/png', 0.95));
  }

  downloadBtn.addEventListener('click', async () => {
    if (!state.img){ setStatus('Add a photo first', 1800); return; }
    const blob = await getCanvasBlob();
    if (!blob) return;
    const filename = state.format === 'A' ? 'hh-goa-2026-frame.png' : 'hh-goa-2026-builder-id.png';
    downloadBlob(blob, filename);
    setStatus('Downloaded ✓', 1800);
  });

  shareBtn.addEventListener('click', async () => {
    if (!state.img){ setStatus('Add a photo first', 1800); return; }
    const blob = await getCanvasBlob();
    if (!blob) return;
    const filename = state.format === 'A' ? 'hh-goa-2026-frame.png' : 'hh-goa-2026-builder-id.png';
    const caption = buildCaption();

    let sharedDirectly = false;
    if (navigator.canShare){
      try{
        const file = new File([blob], filename, { type: 'image/png' });
        if (navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file], text: caption });
          sharedDirectly = true;
        }
      } catch (err){
        if (err && err.name === 'AbortError'){ return; }
      }
    }

    if (!sharedDirectly){
      downloadBlob(blob, filename);
      const tweetUrl = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(caption);
      window.open(tweetUrl, '_blank', 'noopener');
      setStatus('Image downloaded — attach it to the tweet that just opened', 4500);
    }
  });

  // ---------- init ----------
  refreshTitle();
  refreshIdCode();
  render();
})();
</script>
</body>
</html>
